[package]
name = "swifttunnel-relay"
version = "1.4.0"
edition = "2021"
description = "SwiftTunnel V3 UDP Relay Server - Low latency game packet forwarding"
license = "MIT"
repository = "https://github.com/Swift-tunnel/swifttunnel-relay"
keywords = ["vpn", "gaming", "relay", "udp", "low-latency"]
categories = ["network-programming", "games"]

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dashmap = "6"  # Concurrent HashMap
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
